    /* ═══════════════════════════════════════════════
       TIMELINE BLOCK
    ═══════════════════════════════════════════════ */
    function TimelineBlock({ block, index, onToggleDone, onDelete, onEdit, onNudge, hasConflict,
        dragIdx, dragOverIdx, onDragStart, onDragOver, onDrop, onDragEnd }) {
      const [editing, setEditing] = useState(false);
      const [editLabel, setEditLabel] = useState(block.label);
      const [editDur,   setEditDur]   = useState(String(block.duration));
      const [editStart, setEditStart] = useState(minsToInput(block.startTime));
      const editRef = useRef();

      useEffect(() => { if (editing) editRef.current?.select(); }, [editing]);

      const startEdit = () => {
        setEditLabel(block.label); setEditDur(String(block.duration));
        setEditStart(minsToInput(block.startTime)); setEditing(true);
      };
      const saveEdit = () => {
        const dur   = Math.max(5, parseInt(editDur) || block.duration);
        const start = inputToMins(editStart);
        onEdit(index, { ...block, label: editLabel.trim() || block.label, duration: dur,
          startTime: start, endTime: start + dur });
        setEditing(false);
      };

      const isFixed = block.locked;
      const isBreak = block.type === 'break';
      const isFree  = block.type === 'free';
      const isDragging = dragIdx === index;
      const isOver = dragOverIdx === index && dragIdx !== index;
      const minH = Math.max(block.duration * 1.2, isFree ? 36 : 64);
      const conflictBorder = hasConflict ? '2px solid #f87171' : 'none';

      // Edit form (shown inline)
      if (editing) {
        return (
          <div style={{ borderRadius:14, background:block.color.bg, padding:'14px 18px',
            border: `2px solid ${block.color.text}40`, display:'flex', flexDirection:'column', gap:10 }}>
            <div style={{ fontSize:11, fontWeight:700, color:block.color.text, opacity:0.6, textTransform:'uppercase', letterSpacing:'0.06em' }}>Edit block</div>
            <input ref={editRef} value={editLabel} onChange={e => setEditLabel(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && saveEdit()}
              style={{ fontWeight:700, fontSize:14, color:block.color.text,
                background:`${block.color.text}12`, border:`1px solid ${block.color.text}30`, borderRadius:8 }} />
            <div style={{ display:'flex', gap:8 }}>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:11, color:block.color.text, opacity:0.5, marginBottom:4, fontWeight:600 }}>Start time</div>
                <input type="time" value={editStart} onChange={e => setEditStart(e.target.value)}
                  style={{ width:'100%', color:block.color.text, background:`${block.color.text}12`, border:`1px solid ${block.color.text}30`, borderRadius:8 }} />
              </div>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:11, color:block.color.text, opacity:0.5, marginBottom:4, fontWeight:600 }}>Duration (min)</div>
                <input type="number" value={editDur} onChange={e => setEditDur(e.target.value)} min="5"
                  style={{ width:'100%', textAlign:'center', color:block.color.text, background:`${block.color.text}12`, border:`1px solid ${block.color.text}30`, borderRadius:8 }} />
              </div>
            </div>
            <div style={{ display:'flex', gap:8 }}>
              <button onClick={() => setEditing(false)} style={{ flex:1, padding:'8px', borderRadius:10, fontSize:12, fontWeight:700,
                background:'transparent', border:`1px solid ${block.color.text}30`, color:block.color.text, cursor:'pointer' }}>Cancel</button>
              <button onClick={saveEdit} style={{ flex:2, padding:'8px', borderRadius:10, fontSize:13, fontWeight:700,
                background:block.color.text, color:block.color.bg, border:'none', cursor:'pointer' }}>Save changes</button>
            </div>
          </div>
        );
      }

      // Free/gap blocks — minimal dashed style
      if (isFree) {
        return (
          <div onDragOver={e => onDragOver(e, index)} onDrop={e => onDrop(e, index)}
            className={`free-block ${isOver ? 'drag-over' : ''}`}
            style={{ minHeight: minH }}>
            <span style={{ fontSize:14, opacity:0.4 }}>{block.icon}</span>
            <span style={{ flex:1, fontSize:12, color:'#3a3a3a', fontWeight:600 }}>{block.label}</span>
            <span style={{ fontSize:11, color:'#333', fontWeight:500 }}>{fmtDur(block.duration)}</span>
            <button onClick={() => onDelete(index)} className="group-hover-show"
              style={{ background:'none', border:'none', cursor:'pointer', color:'#444', fontSize:16, lineHeight:1, flexShrink:0 }}
              onMouseEnter={e => e.target.style.color='#888'} onMouseLeave={e => e.target.style.color='#444'}>&times;</button>
          </div>
        );
      }

      return (
        <div
          draggable={!isFixed}
          onDragStart={e => !isFixed && onDragStart(e, index)}
          onDragOver={e => onDragOver(e, index)}
          onDrop={e => onDrop(e, index)}
          onDragEnd={onDragEnd}
          className={`block-card ${isDragging ? 'is-dragging' : ''} ${isOver ? 'drag-over' : ''}`}
          style={{ minHeight: minH, borderRadius:14, background:block.color.bg, border: conflictBorder,
            display:'flex', alignItems:'center', padding:'14px 18px', gap:12,
            transition:'border-color 0.15s, box-shadow 0.12s' }}
        >
          {!isFixed && <span className="drag-handle" style={{ color:`${block.color.text}30`, fontSize:16, flexShrink:0, lineHeight:1 }}>⠿</span>}
          <span style={{ fontSize:17, flexShrink:0, lineHeight:1 }}>{isFixed ? '🔒' : block.icon}</span>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontSize:15, fontWeight:700, color:block.color.text, lineHeight:1.3, marginBottom:4,
              textDecoration: block.done ? 'line-through' : 'none', opacity: block.done ? 0.45 : 1 }}>
              {isBreak ? 'Break' : block.label}
              {isFixed && <span style={{ fontSize:10, marginLeft:8, padding:'2px 7px', borderRadius:99, background:`${block.color.text}15`, fontWeight:700 }}>FIXED</span>}
              {hasConflict && <span style={{ fontSize:10, marginLeft:8, padding:'2px 7px', borderRadius:99, background:'#f871711a', color:'#f87171', fontWeight:700 }}>overlap</span>}
            </div>
            <div style={{ fontSize:12, color:block.color.text, opacity:0.55, fontWeight:500 }}>
              {fmtTime(block.startTime)} – {fmtTime(block.endTime)} · {fmtDur(block.duration)}
              {isBreak && <span style={{ fontStyle:'italic', marginLeft:4 }}>(suggested)</span>}
            </div>
          </div>
          {/* Nudge arrows */}
          {!isFixed && (
            <div style={{ display:'flex', flexDirection:'column', gap:2, flexShrink:0 }}>
              <button onClick={() => onNudge(index, -15)} title="Move 15 min earlier"
                style={{ background:`${block.color.text}14`, border:'none', borderRadius:6, cursor:'pointer',
                  color:block.color.text, fontSize:11, lineHeight:1, padding:'3px 5px', transition:'background 0.1s' }}
                onMouseEnter={e => e.currentTarget.style.background=`${block.color.text}28`}
                onMouseLeave={e => e.currentTarget.style.background=`${block.color.text}14`}>▲</button>
              <button onClick={() => onNudge(index, +15)} title="Move 15 min later"
                style={{ background:`${block.color.text}14`, border:'none', borderRadius:6, cursor:'pointer',
                  color:block.color.text, fontSize:11, lineHeight:1, padding:'3px 5px', transition:'background 0.1s' }}
                onMouseEnter={e => e.currentTarget.style.background=`${block.color.text}28`}
                onMouseLeave={e => e.currentTarget.style.background=`${block.color.text}14`}>▼</button>
            </div>
          )}
          <button onClick={() => onToggleDone(index)} style={{
            background:'none', border:'none', cursor:'pointer', fontSize:12, fontWeight:700, flexShrink:0,
            color:block.color.text, opacity: block.done ? 0.9 : 0.3, transition:'opacity 0.15s', padding:'4px 0 4px 4px',
          }}
            onMouseEnter={e => e.target.style.opacity='0.8'}
            onMouseLeave={e => e.target.style.opacity=block.done?'0.9':'0.3'}
          >{block.done ? '✓' : '○'}</button>
          {!isFixed && <button onClick={startEdit} className="group-hover-show"
            style={{ background:'none', border:'none', cursor:'pointer', color:block.color.text, opacity:0.3, fontSize:13, lineHeight:1, flexShrink:0 }}
            onMouseEnter={e => e.target.style.opacity='0.7'} onMouseLeave={e => e.target.style.opacity='0.3'}>✏️</button>}
          <button onClick={() => onDelete(index)} className="group-hover-show"
            style={{ background:'none', border:'none', cursor:'pointer', color:block.color.text, opacity:0.25, fontSize:18, lineHeight:1, flexShrink:0 }}
            onMouseEnter={e => e.target.style.opacity='0.7'} onMouseLeave={e => e.target.style.opacity='0.25'}>&times;</button>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════
       SCHEDULE VIEW
    ═══════════════════════════════════════════════ */
    function ScheduleView({ schedule, overflow, dayStart, dayEnd, categories, onToggleDone, onDeleteBlock, onReorder, onAddBlock, onEditBlock, onNudge, onResort }) {
      const dragIdxRef = useRef(null);
      const [dragIdx, setDragIdx] = useState(null);
      const [dragOverIdx, setDragOverIdx] = useState(null);

      const doneCount = schedule.filter(b => b.done).length;
      const total = schedule.length;
      const pct = total ? Math.round(doneCount / total * 100) : 0;

      // Detect overlapping blocks
      const conflictIds = useMemo(() => {
        const ids = new Set();
        for (let i = 0; i < schedule.length; i++) {
          for (let j = i + 1; j < schedule.length; j++) {
            const a = schedule[i], b = schedule[j];
            if (a.startTime < b.endTime && a.endTime > b.startTime) {
              ids.add(a.id); ids.add(b.id);
            }
          }
        }
        return ids;
      }, [schedule]);
      const hasAnyConflict = conflictIds.size > 0;

      const onDragStart = (e, i) => {
        dragIdxRef.current = i; setDragIdx(i);
        e.dataTransfer.effectAllowed = 'move';
        // Transparent drag ghost for cleaner feel
        const ghost = document.createElement('div');
        ghost.style.cssText = 'position:fixed;top:-999px;left:-999px;opacity:0';
        document.body.appendChild(ghost);
        e.dataTransfer.setDragImage(ghost, 0, 0);
        setTimeout(() => document.body.removeChild(ghost), 0);
      };
      const onDragOver  = (e, i) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; setDragOverIdx(i); };
      const onDrop = (e, ti) => {
        e.preventDefault();
        const si = dragIdxRef.current;
        if (si === null || si === ti) return;
        const next = [...schedule]; const [item] = next.splice(si, 1); next.splice(ti, 0, item);
        // Keep times as-is — allow overlap, show conflicts in red
        onReorder(next); setDragIdx(null); setDragOverIdx(null); dragIdxRef.current = null;
      };
      const onDragEnd = () => { setDragIdx(null); setDragOverIdx(null); dragIdxRef.current = null; };

      if (!schedule.length) return (
        <div style={{ textAlign:'center', paddingTop:80 }}>
          <div style={{ fontSize:52, marginBottom:16 }}>📅</div>
          <p style={{ color:'#777', fontSize:16, fontWeight:600 }}>No schedule yet.</p>
          <p style={{ color:'#444', fontSize:13, marginTop:6 }}>Add tasks, then click <strong style={{color:'#888'}}>Generate Schedule</strong>.</p>
        </div>
      );

      return (
        <div style={{ maxWidth:700 }}>
          <div style={{ background:'#222', borderRadius:16, padding:'14px 18px', border:'1px solid #2e2e2e', marginBottom:20 }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10, fontSize:13 }}>
              <span style={{ fontWeight:700 }}>Today's progress</span>
              <span style={{ fontWeight:800, color:'#aaa' }}>{doneCount} / {total} · {pct}%</span>
            </div>
            <div style={{ height:5, borderRadius:99, background:'#2e2e2e', overflow:'hidden' }}>
              <div className="progress-fill" style={{ height:'100%', borderRadius:99, background:'#e5e5e5', width:`${pct}%` }} />
            </div>
          </div>

          {overflow.length > 0 && (
            <div style={{ background:'#2a1a1a', borderRadius:16, padding:16, border:'1px solid #4a2020', marginBottom:16 }}>
              <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10 }}>
                <span style={{ fontSize:15 }}>⚠️</span>
                <span style={{ fontSize:13, fontWeight:700, color:'#f87171' }}>{overflow.length} task{overflow.length > 1?'s':''} didn't fit</span>
              </div>
              {overflow.map((t, i) => (
                <div key={i} className="overflow-bar" style={{ paddingLeft:12, paddingBottom:4, paddingTop:4, marginBottom:4, fontSize:13, color:'#fca5a5' }}>
                  <strong>{t.label}</strong> · {fmtDur(t.duration)}
                </div>
              ))}
              <p style={{ fontSize:11, color:'#7a4040', marginTop:8 }}>Extend your end time or remove lower-priority tasks.</p>
            </div>
          )}

          {hasAnyConflict && (
            <div style={{ background:'#2a1818', border:'1px solid #4a2222', borderRadius:12, padding:'10px 14px', marginBottom:12, display:'flex', alignItems:'center', justifyContent:'space-between', gap:12 }}>
              <span style={{ fontSize:13, color:'#f87171', fontWeight:600 }}>⚠️ Overlapping blocks detected</span>
              <button onClick={onResort} style={{ fontSize:12, fontWeight:700, padding:'5px 14px', borderRadius:8,
                background:'#f87171', color:'#fff', border:'none', cursor:'pointer' }}>Auto-fix & re-sort</button>
            </div>
          )}

          <div style={{ display:'flex', flexDirection:'column', gap:8 }} className="group">
            {schedule.map((block, i) => (
              <div key={block.id} style={{ display:'flex', alignItems:'flex-start', gap:14 }}>
                <div className="sched-time" style={{ width:42, flexShrink:0, paddingTop:20, fontSize:12, fontWeight:600, color:'#444', textAlign:'right', fontVariantNumeric:'tabular-nums' }}>
                  {fmtTime(block.startTime)}
                </div>
                <div style={{ flex:1, minWidth:0 }}>
                  <TimelineBlock block={block} index={i}
                    onToggleDone={onToggleDone} onDelete={onDeleteBlock}
                    onEdit={onEditBlock} onNudge={onNudge}
                    hasConflict={conflictIds.has(block.id)}
                    dragIdx={dragIdx} dragOverIdx={dragOverIdx}
                    onDragStart={onDragStart} onDragOver={onDragOver}
                    onDrop={onDrop} onDragEnd={onDragEnd} />
                </div>
              </div>
            ))}
          </div>

          {/* Quick-add block */}
          <QuickAddBlock categories={categories} onAdd={onAddBlock} />
        </div>
      );
    }

    function QuickAddBlock({ categories, onAdd }) {
      const [open, setOpen] = useState(false);
      const [name, setName] = useState('');
      const [dur, setDur]   = useState('30');
      const [cat, setCat]   = useState(() => categories[0]?.id || 'work');
      const nameRef = useRef();

      useEffect(() => { if (open) nameRef.current?.focus(); }, [open]);

      const submit = () => {
        if (!name.trim()) return;
        const c = getCat(categories, cat);
        onAdd({
          id: uid(), type: 'standalone', label: name.trim(),
          icon: c.icon, color: { bg: c.bg, text: c.text },
          duration: Math.max(5, parseInt(dur) || 30),
          done: false, locked: false,
          bucketId: null, subtaskId: null, standaloneId: uid(),
        });
        setName(''); setDur('30'); setOpen(false);
      };

      if (!open) return (
        <button onClick={() => setOpen(true)} style={{
          marginTop:8, width:'100%', padding:'11px', borderRadius:14, fontSize:13, fontWeight:600,
          color:'#3a3a3a', background:'transparent', border:'1px dashed #2a2a2a', cursor:'pointer',
          transition:'color 0.15s, border-color 0.15s',
        }}
          onMouseEnter={e => { e.currentTarget.style.color='#777'; e.currentTarget.style.borderColor='#555'; }}
          onMouseLeave={e => { e.currentTarget.style.color='#3a3a3a'; e.currentTarget.style.borderColor='#2a2a2a'; }}>
          + Add block to schedule
        </button>
      );

      return (
        <div style={{ marginTop:8, background:'#222', borderRadius:14, padding:14, border:'1px solid #2e2e2e', display:'flex', flexDirection:'column', gap:10 }}>
          <div style={{ fontSize:11, fontWeight:700, color:'#555', textTransform:'uppercase', letterSpacing:'0.07em' }}>Add block</div>
          <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
            <input ref={nameRef} value={name} onChange={e => setName(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && submit()}
              style={{ flex:1, minWidth:120 }} placeholder="Block name" />
            <input type="number" value={dur} onChange={e => setDur(e.target.value)} min="5"
              style={{ width:70, textAlign:'center' }} placeholder="min" />
          </div>
          <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
            <select value={cat} onChange={e => setCat(e.target.value)} style={{ flex:1, minWidth:120 }}>
              {categories.map(c => <option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}
            </select>
            <button onClick={() => setOpen(false)} className="btn-ghost" style={{ fontSize:12, padding:'6px 12px' }}>Cancel</button>
            <button onClick={submit} style={{ padding:'8px 18px', borderRadius:10, fontSize:13, fontWeight:700, background:'#f5f2ee', color:'#1a1814', border:'none', cursor:'pointer' }}>Add</button>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════
       HEADER
    ═══════════════════════════════════════════════ */
    function Header({ dayStart, dayEnd, onDayStart, onDayEnd, onGenerate, onClear, hasSchedule, user, onSignOut }) {
      return (
        <header style={{ background:'#202020', borderBottom:'1px solid #2a2a2a', padding:'12px 20px', display:'flex', alignItems:'center', gap:16, flexWrap:'wrap', position:'sticky', top:0, zIndex:20 }}>
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <span style={{ fontSize:20 }}>🗓</span>
            <h1 style={{ margin:0, fontSize:17, fontWeight:900, letterSpacing:'-0.02em' }}>TimeBlock</h1>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:10, flexWrap:'wrap' }}>
            <div style={{ display:'flex', alignItems:'center', gap:8, background:'#2a2a2a', borderRadius:10, padding:'6px 12px', border:'1px solid #383838' }}>
              <span style={{ fontSize:10, fontWeight:800, color:'#555', letterSpacing:'0.06em' }}>FROM</span>
              <input type="time" value={minsToInput(dayStart)} onChange={e => onDayStart(inputToMins(e.target.value))}
                style={{ fontSize:13, fontWeight:700, background:'transparent', border:'none', color:'#f0f0f0', outline:'none', width:80, padding:0 }} />
            </div>
            <span style={{ color:'#3a3a3a', fontWeight:800 }}>→</span>
            <div style={{ display:'flex', alignItems:'center', gap:8, background:'#2a2a2a', borderRadius:10, padding:'6px 12px', border:'1px solid #383838' }}>
              <span style={{ fontSize:10, fontWeight:800, color:'#555', letterSpacing:'0.06em' }}>TO</span>
              <input type="time" value={minsToInput(dayEnd)} onChange={e => onDayEnd(inputToMins(e.target.value))}
                style={{ fontSize:13, fontWeight:700, background:'transparent', border:'none', color:'#f0f0f0', outline:'none', width:80, padding:0 }} />
            </div>
            <span style={{ fontSize:12, color:'#444', fontWeight:600 }}>{fmtDur(dayEnd - dayStart)} available</span>
          </div>
          <div style={{ display:'flex', gap:8, marginLeft:'auto', alignItems:'center' }}>
            {user && (
              <>
                <span style={{ fontSize:12, color:'#444', fontWeight:500, maxWidth:180, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{user.email}</span>
                <button onClick={onSignOut} className="btn-ghost" style={{ fontSize:12, padding:'6px 12px' }}>Sign out</button>
              </>
            )}
            {hasSchedule && <button onClick={onClear} className="btn-ghost">Clear</button>}
            <button onClick={onGenerate} style={{
              padding:'8px 20px', borderRadius:10, fontSize:13, fontWeight:800,
              background:'#f5f2ee', color:'#1a1814', border:'none', cursor:'pointer',
              boxShadow:'0 1px 4px rgba(0,0,0,0.3)', transition:'background 0.15s, box-shadow 0.15s, transform 0.1s',
            }}
              onMouseEnter={e => { e.currentTarget.style.background='#fff'; e.currentTarget.style.transform='translateY(-1px)'; }}
              onMouseLeave={e => { e.currentTarget.style.background='#f5f2ee'; e.currentTarget.style.transform='translateY(0)'; }}
            >Generate Schedule ✨</button>
          </div>
        </header>
      );
    }

    /* ═══════════════════════════════════════════════
       DATE NAV
    ═══════════════════════════════════════════════ */
    function DateNav({ currentDate, onDate }) {
      const isToday = currentDate === todayStr();
      return (
        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
          <button onClick={() => onDate(offsetDate(currentDate, -1))}
            style={{ background:'none', border:'none', cursor:'pointer', color:'#555', fontSize:18, lineHeight:1, padding:'2px 6px', borderRadius:8, transition:'color 0.12s' }}
            onMouseEnter={e => e.currentTarget.style.color='#aaa'} onMouseLeave={e => e.currentTarget.style.color='#555'}>‹</button>
          <button onClick={() => onDate(todayStr())}
            style={{ background: isToday ? '#2a2a2a' : 'transparent', border:'1px solid', borderColor: isToday ? '#3a3a3a' : 'transparent',
              color: isToday ? '#f0f0f0' : '#aaa', fontSize:13, fontWeight:700, cursor:'pointer', borderRadius:8,
              padding:'4px 12px', transition:'all 0.12s', whiteSpace:'nowrap' }}>
            {dateLabel(currentDate)}
          </button>
          <button onClick={() => onDate(offsetDate(currentDate, 1))}
            style={{ background:'none', border:'none', cursor:'pointer', color:'#555', fontSize:18, lineHeight:1, padding:'2px 6px', borderRadius:8, transition:'color 0.12s' }}
            onMouseEnter={e => e.currentTarget.style.color='#aaa'} onMouseLeave={e => e.currentTarget.style.color='#555'}>›</button>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════
       APP
    ═══════════════════════════════════════════════ */
    function App() {
      // undefined = checking session, null = logged out, object = logged in
      const [user, setUser]       = useState(undefined);
      const [syncing, setSyncing] = useState(false);

      const saved = useMemo(() => loadData(), []);
      const [currentDate,    setCurrentDate]    = useState(todayStr);
      const [days,           setDays]           = useState(saved?.days          ?? DEFAULTS.days);
      const [templates,      setTemplates]      = useState(saved?.templates     ?? DEFAULTS.templates);
      const [fixedTemplates, setFixedTemplates] = useState(saved?.fixedTemplates ?? DEFAULTS.fixedTemplates);
      const [categories,     setCategories]     = useState(saved?.categories    ?? DEFAULTS.categories);
      const [view,           setView]           = useState('tasks');
      const [editBucket,     setEditBucket]     = useState(null);
      const [showNewBkt,     setShowNewBkt]     = useState(false);

      const cloudReady  = useRef(false);
      const saveTimer   = useRef(null);
      const recalcTimer = useRef(null);

      // Derive current day's data (falls back to DEFAULT_DAY if date not yet saved)
      const day = days[currentDate] ?? DEFAULT_DAY;
      const { dayStart, dayEnd, buckets, tasks, fixedEvents, schedule, overflow } = day;

      // Helper to update a single field on the current day
      const setDayField = (field, valueOrFn) => setDays(prev => {
        const cur = prev[currentDate] ?? DEFAULT_DAY;
        const newVal = typeof valueOrFn === 'function' ? valueOrFn(cur[field]) : valueOrFn;
        return { ...prev, [currentDate]: { ...cur, [field]: newVal } };
      });

      // Wrapper setters that mirror the old individual setState API
      const setDayStart = v  => setDayField('dayStart', v);
      const setDayEnd   = v  => setDayField('dayEnd', v);
      const setBuckets  = fn => setDayField('buckets', fn);
      const setTasks    = fn => setDayField('tasks', fn);
      const setFixed    = fn => setDayField('fixedEvents', fn);
      const setSchedule = fn => setDayField('schedule', fn);
      const setOverflow = fn => setDayField('overflow', fn);

      // Auth session setup
      useEffect(() => {
        if (!sb) { setUser(null); return; }
        sb.auth.getSession().then(({ data: { session } }) => {
          setUser(session?.user ?? null);
        });
        const { data: { subscription } } = sb.auth.onAuthStateChange((event, session) => {
          // Only reset cloudReady on actual sign-out, not on token refreshes
          if (event === 'SIGNED_OUT') cloudReady.current = false;
          setUser(session?.user ?? null);
        });
        return () => subscription.unsubscribe();
      }, []);

      // Load cloud data when user logs in
      useEffect(() => {
        if (!user || !sb) return;
        setSyncing(true);
        loadCloud(user.id).then(data => {
          if (data) {
            if (data.days)           setDays(data.days);
            if (data.templates)      setTemplates(data.templates);
            if (data.fixedTemplates) setFixedTemplates(data.fixedTemplates);
            if (data.categories)     setCategories(data.categories);
          }
          cloudReady.current = true;
          setSyncing(false);
        });
      }, [user?.id]);

      // Save to localStorage + debounced cloud save
      useEffect(() => {
        const d = { days, templates, fixedTemplates, categories };
        saveData(d);
        if (user && sb && cloudReady.current) {
          clearTimeout(saveTimer.current);
          saveTimer.current = setTimeout(() => saveCloud(user.id, d), 1500);
        }
      }, [days, templates, fixedTemplates, categories]);

      const handleSignOut = async () => {
        clearTimeout(saveTimer.current);
        cloudReady.current = false;
        if (sb) await sb.auth.signOut();
      };

      // Day start/end — recalculate schedule after a short delay if one exists
      const handleDayStart = v => {
        setDayStart(v);
        if (schedule.length > 0) {
          clearTimeout(recalcTimer.current);
          recalcTimer.current = setTimeout(() => {
            setSchedule(prev => fillGaps(recalcTimes(stripFree(prev), v), v, dayEnd));
          }, 600);
        }
      };
      const handleDayEnd = v => {
        setDayEnd(v);
        if (schedule.length > 0) {
          clearTimeout(recalcTimer.current);
          recalcTimer.current = setTimeout(() => {
            setSchedule(prev => fillGaps(recalcTimes(stripFree(prev), dayStart), dayStart, v));
          }, 600);
        }
      };

      const handleGenerate = () => {
        const r = buildSchedule(buckets, tasks, fixedEvents, dayStart, dayEnd, categories);
        setSchedule(fillGaps(r.schedule, dayStart, dayEnd));
        setOverflow(r.overflow); setView('schedule');
      };
      const handleClear       = () => { setSchedule([]); setOverflow([]); };
      const handleToggleDone  = idx => setSchedule(prev => { const n=[...prev]; n[idx]={...n[idx],done:!n[idx].done}; return n; });
      const handleDeleteBlock = idx => setSchedule(prev => {
        const cleaned = stripFree(prev.filter((_,i) => i !== idx));
        return fillGaps(recalcTimes(cleaned, dayStart), dayStart, dayEnd);
      });
      // Reorder: keep block times as-is so overlaps are visible in red
      const handleReorder = next => setSchedule(next);
      const handleAddBlock = block => setSchedule(prev => {
        const noFree = stripFree(prev);
        const last = noFree.reduce((m, b) => Math.max(m, b.endTime), dayStart);
        const newBlock = { ...block, startTime: last, endTime: last + block.duration };
        return fillGaps(recalcTimes([...noFree, newBlock], dayStart), dayStart, dayEnd);
      });
      // Inline block edit — apply new props, allow overlaps (user can re-sort to fix)
      const handleEditBlock = (idx, updated) => setSchedule(prev => {
        const n = [...prev]; n[idx] = updated; return n;
      });
      // Nudge ±15 min — allow overlap
      const handleNudge = (idx, delta) => setSchedule(prev => {
        const b = prev[idx];
        const newStart = Math.max(0, b.startTime + delta);
        const n = [...prev];
        n[idx] = { ...b, startTime: newStart, endTime: newStart + b.duration };
        return n;
      });
      // Re-sort + recalcTimes to resolve all conflicts
      const handleResort = () => setSchedule(prev =>
        fillGaps(recalcTimes(stripFree([...prev].sort((a,b) => a.startTime - b.startTime)), dayStart), dayStart, dayEnd)
      );
      const handleSaveBucket     = b => setBuckets(prev => { const i=prev.findIndex(x=>x.id===b.id); if(i>=0){const n=[...prev];n[i]=b;return n;} return [...prev,b]; });
      const handleDeleteBucket   = id => setBuckets(prev => prev.filter(b=>b.id!==id));
      const handleAddTask        = t => setTasks(prev => [...prev, t]);
      const handleDeleteTask     = id => setTasks(prev => prev.filter(t=>t.id!==id));
      const handleAddFixed       = fe => setFixed(prev => [...prev, fe]);
      const handleDeleteFixed    = id => setFixed(prev => prev.filter(f=>f.id!==id));
      const handleUseTemplate    = tpl => handleAddTask({ id:uid(), name:tpl.name, duration:tpl.duration, category:tpl.category, slot:'any', priority:'normal', done:false });
      const handleDeleteTemplate = id => setTemplates(prev => prev.filter(t=>t.id!==id));
      const handleAddTemplate    = tpl => setTemplates(prev => [...prev, tpl]);
      const handleReorderTemplates = newList => setTemplates(newList);
      // Fixed-event templates
      const handleSaveFixedTemplate  = ft  => setFixedTemplates(prev => [...prev, ft]);
      const handleDeleteFixedTemplate = id => setFixedTemplates(prev => prev.filter(f=>f.id!==id));
      const handleUseFixedTemplate   = ft  => handleAddFixed({ ...ft, id: uid() });

      const doneCount = schedule.filter(b => b.done).length;

      // Checking auth session
      if (user === undefined) return (
        <div style={{ minHeight:'100vh', background:'#191919', display:'flex', alignItems:'center', justifyContent:'center' }}>
          <span style={{ color:'#444', fontSize:14, fontWeight:600 }}>Loading…</span>
        </div>
      );

      // Logged out (Supabase is configured)
      if (!user && sb) return <LoginScreen />;

      return (
        <div style={{ display:'flex', flexDirection:'column', height:'100vh' }}>
          <Header dayStart={dayStart} dayEnd={dayEnd}
            onDayStart={handleDayStart} onDayEnd={handleDayEnd}
            onGenerate={handleGenerate} onClear={handleClear}
            hasSchedule={schedule.length > 0}
            user={user} onSignOut={handleSignOut} />

          {syncing && (
            <div style={{ background:'#1e1e1e', padding:'5px 24px', fontSize:11, color:'#555', fontWeight:600, borderBottom:'1px solid #252525', letterSpacing:'0.04em' }}>
              ↻ Syncing…
            </div>
          )}

          <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden', background:'#191919' }}>
            <div style={{ background:'#202020', borderBottom:'1px solid #2a2a2a', padding:'0 20px', display:'flex', alignItems:'center', gap:16 }}>
              <div style={{ display:'flex', gap:20 }}>
                {[['tasks','Tasks'],['schedule','Schedule']].map(([id,lbl]) => (
                  <button key={id} onClick={() => setView(id)} className={`tab-btn ${view===id?'active':''}`}>
                    {lbl}
                    {id==='schedule' && schedule.length > 0 && (
                      <span style={{ marginLeft:6, fontSize:10, background:'#2e2e2e', color:'#777', padding:'1px 6px', borderRadius:99, fontWeight:700 }}>
                        {doneCount}/{schedule.length}
                      </span>
                    )}
                  </button>
                ))}
              </div>
              <div style={{ marginLeft:'auto' }}>
                <DateNav currentDate={currentDate} onDate={setCurrentDate} />
              </div>
            </div>

            <div className="content-pad" style={{ flex:1, overflowY:'auto', padding:'24px 28px' }}>
              {view === 'tasks' && (
                <div style={{ maxWidth:680 }}>
                  <TasksPanel
                    buckets={buckets} tasks={tasks} fixedEvents={fixedEvents}
                    templates={templates} fixedTemplates={fixedTemplates}
                    schedule={schedule} categories={categories}
                    onAddTask={handleAddTask} onDeleteTask={handleDeleteTask}
                    onAddFixed={handleAddFixed} onDeleteFixed={handleDeleteFixed}
                    onNewBucket={() => setShowNewBkt(true)}
                    onEditBucket={b => setEditBucket(b)} onDeleteBucket={handleDeleteBucket}
                    onUseTemplate={handleUseTemplate}
                    onDeleteTemplate={handleDeleteTemplate} onAddTemplate={handleAddTemplate}
                    onReorderTemplates={handleReorderTemplates}
                    onSaveFixedTemplate={handleSaveFixedTemplate}
                    onDeleteFixedTemplate={handleDeleteFixedTemplate}
                    onUseFixedTemplate={handleUseFixedTemplate}
                    onCategoriesChange={setCategories}
                  />
                </div>
              )}
              {view === 'schedule' && (
                <ScheduleView schedule={schedule} overflow={overflow} dayStart={dayStart} dayEnd={dayEnd}
                  categories={categories} onToggleDone={handleToggleDone}
                  onDeleteBlock={handleDeleteBlock} onReorder={handleReorder}
                  onAddBlock={handleAddBlock} onEditBlock={handleEditBlock}
                  onNudge={handleNudge} onResort={handleResort} />
              )}
            </div>
          </div>

          {(showNewBkt || editBucket) && (
            <BucketEditor bucket={editBucket}
              onSave={b => { handleSaveBucket(b); setEditBucket(null); setShowNewBkt(false); }}
              onClose={() => { setEditBucket(null); setShowNewBkt(false); }} />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
