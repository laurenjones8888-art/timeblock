<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeBlock</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #191919; color: #f0f0f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 99px; }
    input, select { color: #f0f0f0; background: #2a2a2a; border: 1px solid #404040; border-radius: 10px; outline: none; padding: 8px 12px; font-size: 13px; font-family: inherit; }
    input:focus, select:focus { border-color: #888; box-shadow: 0 0 0 2px #88888830; }
    input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(0.6); cursor: pointer; }
    input::placeholder { color: #555; }
    select option { background: #2a2a2a; }
    button { font-family: inherit; }
    .drag-handle { cursor: grab; user-select: none; }
    .drag-handle:active { cursor: grabbing; }
    .block-card { transition: box-shadow 0.12s, opacity 0.15s; }
    .block-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    .is-dragging { opacity: 0.25 !important; }
    .drag-over { box-shadow: 0 0 0 2px #888 inset !important; }
    .done-text { text-decoration: line-through; opacity: 0.4; }
    .progress-fill { transition: width 0.5s ease; }
    .modal-bg { background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); }
    .tab-btn { background: none; border: none; cursor: pointer; font-family: inherit; padding: 0 0 11px 0; font-size: 13px; font-weight: 600; border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s; }
    .tab-btn.active { color: #f0f0f0; border-color: #f0f0f0; }
    .tab-btn:not(.active) { color: #555; }
    .tab-btn:not(.active):hover { color: #999; }
    .btn-ghost { background: transparent; border: 1px solid #3a3a3a; color: #999; border-radius: 10px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s, color 0.15s; }
    .btn-ghost:hover { background: #2a2a2a; color: #f0f0f0; }
    .overflow-bar { border-left: 3px solid #f87171; }
    .group { position: relative; }
    .group-hover-show { opacity: 0; transition: opacity 0.15s; }
    .group:hover .group-hover-show { opacity: 1; }
    .emoji-btn { background: none; border: 1px solid transparent; border-radius: 6px; cursor: pointer; font-size: 18px; padding: 3px 5px; transition: border-color 0.1s, background 0.1s; }
    .emoji-btn:hover { background: #333; border-color: #555; }
    .emoji-btn.selected { background: #3a3a3a; border-color: #888; }
    .tab-scroll { display: flex; gap: 20px; border-bottom: 1px solid #2a2a2a; margin-bottom: 24px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; flex-shrink: 0; }
    .tab-scroll::-webkit-scrollbar { display: none; }
    .free-block { border: 1px dashed #2e2e2e; border-radius: 14px; display: flex; align-items: center; padding: 10px 16px; gap: 10px; }
    @media (max-width: 640px) {
      .content-pad { padding: 16px 14px !important; }
      .header-inner { flex-wrap: wrap; gap: 8px; }
      .header-user { display: none; }
      .sched-time { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    /* ═══════════════════════════════════════════════
       SUPABASE CONFIG
       Fill these in after setting up your project at supabase.com
    ═══════════════════════════════════════════════ */
    const SUPABASE_URL = 'https://ulkbrmjyhrlifmrybrgj.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsa2JybWp5aHJsaWZtcnlicmdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MTcxNjcsImV4cCI6MjA5NTI5MzE2N30.13HtwfS9mYSBv0xj7HEBaHnv13ri_D1EiLMv0Vptq-I';
    const sb = !SUPABASE_URL.startsWith('YOUR')
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

    const loadCloud = async uid => {

        return data?.data ?? null;

    /* ═══════════════════════════════════════════════
       BUCKET PALETTE
    ═══════════════════════════════════════════════ */
    const PALETTE = [
      { id: 'violet',  bg: '#ede8ff', text: '#3d2f8a' },
      { id: 'sky',     bg: '#e5effd', text: '#1a3f80' },
      { id: 'emerald', bg: '#e4f8ee', text: '#145035' },
      { id: 'amber',   bg: '#fef7e2', text: '#6b4e17' },
      { id: 'rose',    bg: '#fde4eb', text: '#7f2038' },
      { id: 'orange',  bg: '#fef0e4', text: '#7a3514' },
      { id: 'pink',    bg: '#fde5f3', text: '#7f1e5c' },
      { id: 'indigo',  bg: '#e8ecff', text: '#2a368a' },
      { id: 'teal',    bg: '#e4f8f7', text: '#145859' },
      { id: 'stone',   bg: '#f5f2ee', text: '#5a5147' },
    ];
    const PALETTE_ICONS = {
      violet: '🎯', sky: '💬', emerald: '✅', amber: '⭐',
      rose: '❤️', orange: '🔥', pink: '🌸', indigo: '🔷', teal: '🌊', stone: '📋',
    };

    /* ═══════════════════════════════════════════════
       CATEGORY SYSTEM
    ═══════════════════════════════════════════════ */
    const COLOR_PAIRS = [
      { name: 'violet', bg: '#ede8ff', text: '#3d2f8a' },
      { name: 'blue',   bg: '#e5effd', text: '#1a3f80' },
      { name: 'green',  bg: '#e4f8ee', text: '#145035' },
      { name: 'yellow', bg: '#fef7e2', text: '#6b4e17' },
      { name: 'pink',   bg: '#fde4eb', text: '#7f2038' },
      { name: 'orange', bg: '#fef0e4', text: '#7a3514' },
      { name: 'rose',   bg: '#fde5f3', text: '#7f1e5c' },
      { name: 'indigo', bg: '#e8ecff', text: '#2a368a' },
      { name: 'teal',   bg: '#e4f8f7', text: '#145859' },
      { name: 'stone',  bg: '#f5f2ee', text: '#5a5147' },
      { name: 'red',    bg: '#fde8e8', text: '#7f1f1f' },
      { name: 'lime',   bg: '#f0fde4', text: '#365314' },
    ];

    const EMOJI_PRESETS = [
      '🎯','💼','📚','🏃','🍴','☕','💰','👥','🎵','📋',
      '💡','🌱','✈️','🏥','🎨','🔧','📱','🏠','♡','⭐',
      '🎓','🛒','🐾','🌙','💊','🎮','📝','🚗','🏋️','🧘',
      '🍕','🧠','📷','🎤','🌍','🔑','📦','🎁','🌸','⚡',
    ];

    const DEFAULT_CATEGORIES = [
      { id: 'work',     label: 'Work',     icon: '🎯', bg: '#ede8ff', text: '#3d2f8a' },
      { id: 'meals',    label: 'Meals',    icon: '🍴', bg: '#fef7e2', text: '#6b4e17' },
      { id: 'fitness',  label: 'Fitness',  icon: '🏃', bg: '#e4f8ee', text: '#145035' },
      { id: 'admin',    label: 'Admin',    icon: '📋', bg: '#f5f2ee', text: '#5a5147' },
      { id: 'personal', label: 'Personal', icon: '♡',  bg: '#fde4eb', text: '#7f2038' },
      { id: 'meeting',  label: 'Meeting',  icon: '👥', bg: '#e5effd', text: '#1a3f80' },
      { id: 'other',    label: 'Other',    icon: '📌', bg: '#fef0e4', text: '#7a3514' },
    ];

    const getCat = (categories, id) =>
      categories.find(c => c.id === id) || categories[0] || DEFAULT_CATEGORIES[0];

    const BREAK_C = { bg: '#f5f2ee', text: '#6b6560', icon: '☕' };

    const DEFAULT_TEMPLATES = [
      { id: 'tpl-gym',   name: 'Gym',            duration: 90,  category: 'fitness' },
      { id: 'tpl-lunch', name: 'Lunch',           duration: 45,  category: 'meals'   },
      { id: 'tpl-email', name: 'Email Triage',    duration: 30,  category: 'admin'   },
      { id: 'tpl-deep',  name: 'Deep Work Block', duration: 120, category: 'work'    },
      { id: 'tpl-walk',  name: 'Walk',            duration: 20,  category: 'fitness' },
    ];

    const STORAGE_KEY = 'timeblock_v4';

    const DEFAULT_DAY = {
      dayStart: 540, dayEnd: 1080,
      buckets: [], tasks: [], fixedEvents: [],
      schedule: [], overflow: [],
    };

    const DEFAULTS = {
      templates: DEFAULT_TEMPLATES,
      fixedTemplates: [],
      categories: DEFAULT_CATEGORIES,
      days: {},
    };

    /* ═══════════════════════════════════════════════
       UTILS
    ═══════════════════════════════════════════════ */
    let _n = 0;
    const uid = () => `${Date.now()}-${++_n}`;
    const pad2 = n => String(n).padStart(2, '0');

    const fmtTime = m => {
      const h = Math.floor(m / 60), min = m % 60;
      const h12 = h > 12 ? h - 12 : (h === 0 ? 12 : h);
      return `${h12}:${pad2(min)}`;
    };
    const fmtDur = m => {
      if (m < 60) return `${m} min`;
      const h = m / 60;
      if (Number.isInteger(h)) return `${h} hr${h !== 1 ? 's' : ''}`;
      return `${h} hrs`;
    };
    const inputToMins = s => { const [h, m] = s.split(':').map(Number); return h * 60 + (m || 0); };
    const minsToInput = m => `${pad2(Math.floor(m / 60))}:${pad2(m % 60)}`;
    const getColor = id => PALETTE.find(p => p.id === id) || PALETTE[0];
    const colorPairIdx = (bg) => Math.max(0, COLOR_PAIRS.findIndex(p => p.bg === bg));

    // Date utilities
    const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
    const offsetDate = (dateStr, n) => { const d = new Date(dateStr + 'T12:00:00'); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
    const dateLabel = (dateStr) => {
      const today = todayStr();
      if (dateStr === today) return 'Today';
      if (dateStr === offsetDate(today, 1)) return 'Tomorrow';
      if (dateStr === offsetDate(today, -1)) return 'Yesterday';
      const d = new Date(dateStr + 'T12:00:00');
      return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    };

    const loadData = () => {
      try {
        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (!raw) return null;
        // Migrate old flat format → new days-keyed format
        if (raw.tasks !== undefined && !raw.days) {
          const today = todayStr();
          return {
            categories: raw.categories,
            templates: raw.templates,
            days: { [today]: { dayStart: raw.dayStart ?? 540, dayEnd: raw.dayEnd ?? 1080,
              tasks: raw.tasks ?? [], buckets: raw.buckets ?? [], fixedEvents: raw.fixedEvents ?? [],
              schedule: raw.schedule ?? [], overflow: raw.overflow ?? [] } }
          };
        }
        return raw;
      } catch { return null; }
    };
    const saveData = d => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch {} };

    /* ═══════════════════════════════════════════════
       SCHEDULE ALGORITHM
    ═══════════════════════════════════════════════ */

    // Determine slot preference for a task item
    const getSlotPref = (task) => {
      if (task?.slot && task.slot !== 'any') return task.slot;
      const catId = task?.category || '';
      if (catId === 'work' || catId === 'meeting') return 'work';
      const l = (task?.name || '').toLowerCase();
      if (l.includes('breakfast') || l.includes('morning coffee') || l.includes('morning tea')) return 'morning';
      if (l.includes('lunch') || l.includes('brunch')) return 'midday';
      if (l.includes('dinner') || l.includes('supper') || l.includes('evening meal')) return 'evening';
      return 'any';
    };

    const buildSchedule = (buckets, tasks, fixedEvents, dayStart, dayEnd, categories) => {
      // Time ranges for each slot preference (minutes from midnight)
      const SLOT_RANGES = {
        morning: [dayStart,               Math.min(720,  dayEnd)],  // start → noon
        midday:  [Math.max(660, dayStart), Math.min(840,  dayEnd)],  // 11am → 2pm
        work:    [Math.max(540, dayStart), Math.min(1020, dayEnd)],  // 9am  → 5pm
        evening: [Math.max(1020, dayStart), dayEnd],                 // 5pm  → end
      };

      const items = [];

      for (const b of buckets) {
        if (!b.subtasks.length) continue;
        const pal = getColor(b.color);
        const color = { bg: pal.bg, text: pal.text };
        const icon = PALETTE_ICONS[b.color] || '📦';
        if (!b.explode) {
          const dur = b.subtasks.reduce((s, t) => s + t.duration, 0);
          items.push({ id: uid(), type: 'bucket', bucketId: b.id, subtaskId: null, standaloneId: null,
            label: b.name, duration: dur, icon, color, slotPref: 'any',
            priority: b.subtasks.some(t => t.priority === 'high') ? 'high' : 'normal' });
        } else {
          for (const st of b.subtasks) {
            items.push({ id: uid(), type: 'subtask', bucketId: b.id, subtaskId: st.id, standaloneId: null,
              label: `${b.name} · ${st.name}`, duration: st.duration, icon, color,
              priority: st.priority, slotPref: 'any' });
          }
        }
      }

      for (const t of tasks) {
        const c = getCat(categories, t.category);
        items.push({ id: uid(), type: 'standalone', bucketId: null, subtaskId: null, standaloneId: t.id,
          label: t.name, duration: t.duration, icon: c.icon,
          color: { bg: c.bg, text: c.text }, priority: t.priority,
          slotPref: getSlotPref(t) });
      }

      // Sort: respect time-of-day order (morning first) then priority within each group
      const slotOrder = { morning: 0, midday: 1, work: 1, any: 2, evening: 3 };
      const sorted = [...items].sort((a, b) => {
        const aPri = a.priority === 'high' ? 0 : 1;
        const bPri = b.priority === 'high' ? 0 : 1;
        if (aPri !== bPri) return aPri - bPri;
        return (slotOrder[a.slotPref] ?? 2) - (slotOrder[b.slotPref] ?? 2);
      });

      const fixedSorted = [...fixedEvents]
        .filter(fe => fe.endTime > dayStart && fe.startTime < dayEnd)
        .sort((a, b) => a.startTime - b.startTime);

      const slots = [];
      let cur = dayStart;
      for (const fe of fixedSorted) {
        if (fe.startTime > cur) slots.push({ start: cur, end: fe.startTime, cursor: cur });
        cur = Math.max(cur, fe.endTime);
      }
      if (cur < dayEnd) slots.push({ start: cur, end: dayEnd, cursor: cur });

      // Place item in best slot matching its time preference
      const placeItem = (item) => {
        const pref = item.slotPref;
        if (pref && pref !== 'any' && SLOT_RANGES[pref]) {
          const [prefStart, prefEnd] = SLOT_RANGES[pref];
          // First: slot cursor already inside preferred range
          for (const slot of slots) {
            if (slot.cursor >= prefStart && slot.cursor < prefEnd && slot.cursor + item.duration <= slot.end)
              return slot;
          }
          // Second: slot can be advanced to preferred start
          for (const slot of slots) {
            const tryFrom = Math.max(slot.cursor, prefStart);
            if (tryFrom < prefEnd && tryFrom + item.duration <= slot.end) {
              slot.cursor = tryFrom; // skip ahead — fillGaps will cover the gap
              return slot;
            }
          }
        }
        return slots.find(s => s.cursor + item.duration <= s.end) ?? null;
      };

      const scheduled = [], overflow = [];
      for (const item of sorted) {
        const slot = placeItem(item);
        if (slot) {
          scheduled.push({ id: item.id, type: item.type, bucketId: item.bucketId,
            subtaskId: item.subtaskId, standaloneId: item.standaloneId,
            label: item.label, icon: item.icon, startTime: slot.cursor,
            endTime: slot.cursor + item.duration, duration: item.duration,
            done: false, color: item.color, locked: false });
          slot.cursor += item.duration;
          if (item.duration > 90 && slot.cursor < slot.end) {
            const bd = Math.min(25, slot.end - slot.cursor);
            if (bd >= 10) {
              scheduled.push({ id: uid(), type: 'break', label: 'Break', icon: '☕',
                bucketId: null, subtaskId: null, standaloneId: null,
                startTime: slot.cursor, endTime: slot.cursor + bd, duration: bd,
                done: false, color: { bg: BREAK_C.bg, text: BREAK_C.text }, locked: false });
              slot.cursor += bd;
            }
          }
        } else {
          overflow.push({ label: item.label, duration: item.duration });
        }
      }

      const fixedBlocks = fixedSorted.map(fe => {
        const c = getCat(categories, fe.category);
        return { id: fe.id, type: 'fixed', label: fe.name, icon: c.icon, bucketId: null,
          subtaskId: null, standaloneId: null, startTime: fe.startTime, endTime: fe.endTime,
          duration: fe.endTime - fe.startTime, done: false,
          color: { bg: c.bg, text: c.text }, locked: true };
      });

      return { schedule: [...fixedBlocks, ...scheduled].sort((a, b) => a.startTime - b.startTime), overflow };
    };

    const recalcTimes = (schedule, dayStart) => {
      const fixed = schedule.filter(b => b.locked).sort((a, b) => a.startTime - b.startTime);
      const movable = schedule.filter(b => !b.locked);
      const slots = [];
      let cur = dayStart;
      for (const fe of fixed) {
        if (fe.startTime > cur) slots.push({ start: cur, end: fe.startTime, cursor: cur });
        cur = Math.max(cur, fe.endTime);
      }
      slots.push({ start: cur, end: Infinity, cursor: cur });
      const result = [...fixed];
      for (const block of movable) {
        let placed = false;
        for (const s of slots) {
          if (s.cursor + block.duration <= s.end) {
            result.push({ ...block, startTime: s.cursor, endTime: s.cursor + block.duration });
            s.cursor += block.duration; placed = true; break;
          }
        }
        if (!placed) result.push(block);
      }
      return result.sort((a, b) => a.startTime - b.startTime);
    };

    /* Fill empty gaps in a schedule with Free/Break blocks */
    const fillGaps = (schedule, dayStart, dayEnd) => {
      if (!schedule.length) return schedule;
      const result = [];
      let cursor = dayStart;
      for (const block of schedule) {
        const gap = block.startTime - cursor;
        if (gap >= 15) {
          result.push({
            id: uid(), type: 'free',
            label: gap <= 30 ? 'Break' : 'Free time',
            icon: gap <= 30 ? '☕' : '🌿',
            bucketId: null, subtaskId: null, standaloneId: null,
            startTime: cursor, endTime: block.startTime, duration: gap,
            done: false, color: { bg: '#1f1f1f', text: '#4a4a4a' }, locked: false,
          });
        }
        result.push(block);
        cursor = block.endTime;
      }
      const endGap = dayEnd - cursor;
      if (endGap >= 15) {
        result.push({
          id: uid(), type: 'free', label: 'Free time', icon: '🌿',
          bucketId: null, subtaskId: null, standaloneId: null,
          startTime: cursor, endTime: dayEnd, duration: endGap,
          done: false, color: { bg: '#1f1f1f', text: '#4a4a4a' }, locked: false,
        });
      }
      return result;
    };

    const stripFree = s => s.filter(b => b.type !== 'free');

    /* ═══════════════════════════════════════════════
       LOGIN SCREEN
    ═══════════════════════════════════════════════ */
    function LoginScreen() {
      const [mode, setMode]       = useState('login');
      const [email, setEmail]     = useState('');
      const [password, setPass]   = useState('');
      const [error, setError]     = useState('');
      const [loading, setLoading] = useState(false);
      const [msg, setMsg]         = useState('');

      const submit = async () => {
        if (!email.trim() || !password) { setError('Please enter your email and password.'); return; }
        setError(''); setMsg(''); setLoading(true);
        try {
          if (mode === 'signup') {
            const { error: e } = await sb.auth.signUp({ email: email.trim(), password });
            if (e) throw e;
            setMsg('Account created! Check your email to confirm it, then sign in.');
            setMode('login');
          } else {
            const { error: e } = await sb.auth.signInWithPassword({ email: email.trim(), password });
            if (e) throw e;
          }
        } catch (e) { setError(e.message); }
        setLoading(false);
      };

      return (
        <div style={{ minHeight:'100vh', background:'#191919', display:'flex', alignItems:'center', justifyContent:'center', padding:20 }}>
          <div style={{ width:'100%', maxWidth:360 }}>
            <div style={{ textAlign:'center', marginBottom:32 }}>
              <div style={{ fontSize:44, marginBottom:10 }}>🗓</div>
              <h1 style={{ fontSize:26, fontWeight:900, color:'#f0f0f0', letterSpacing:'-0.03em', margin:0 }}>TimeBlock</h1>
              <p style={{ color:'#444', fontSize:14, marginTop:6, fontWeight:500 }}>Your personal day planner</p>
            </div>
            <div style={{ background:'#232323', border:'1px solid #2e2e2e', borderRadius:20, padding:28 }}>
              <div style={{ display:'flex', background:'#191919', borderRadius:12, padding:3, marginBottom:22 }}>
                {[['login','Sign in'],['signup','Sign up']].map(([m, lbl]) => (
                  <button key={m} onClick={() => { setMode(m); setError(''); setMsg(''); }}
                    style={{ flex:1, padding:'8px', borderRadius:9, fontSize:13, fontWeight:700, border:'none', cursor:'pointer',
                      background: mode===m ? '#2e2e2e' : 'transparent',
                      color: mode===m ? '#f0f0f0' : '#555', transition:'all 0.15s' }}>
                    {lbl}
                  </button>
                ))}
              </div>
              <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
                <div>
                  <div style={{ fontSize:11, fontWeight:700, color:'#555', textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:6 }}>Email</div>
                  <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                    onKeyDown={e => e.key==='Enter' && submit()} style={{ width:'100%' }}
                    placeholder="you@example.com" autoFocus />
                </div>
                <div>
                  <div style={{ fontSize:11, fontWeight:700, color:'#555', textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:6 }}>Password</div>
                  <input type="password" value={password} onChange={e => setPass(e.target.value)}
                    onKeyDown={e => e.key==='Enter' && submit()} style={{ width:'100%' }}
                    placeholder="••••••••" />
                </div>
                {error && <div style={{ background:'#2a1818', border:'1px solid #4a2222', borderRadius:10, padding:'10px 14px', fontSize:13, color:'#f87171', lineHeight:1.4 }}>{error}</div>}
                {msg   && <div style={{ background:'#182a1a', border:'1px solid #224a26', borderRadius:10, padding:'10px 14px', fontSize:13, color:'#86efac', lineHeight:1.4 }}>{msg}</div>}
                <button onClick={submit} disabled={loading}
                  style={{ marginTop:2, padding:'12px', borderRadius:12, fontSize:14, fontWeight:800,
                    background:'#f5f2ee', color:'#1a1814', border:'none', cursor:loading?'default':'pointer',
                    opacity:loading?0.6:1, transition:'opacity 0.15s' }}>
                  {loading ? 'Please wait…' : mode==='login' ? 'Sign in →' : 'Create account →'}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════
       MODAL
    ═══════════════════════════════════════════════ */
    function Modal({ title, onClose, children }) {
      useEffect(() => {
        const h = e => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', h);
        return () => document.removeEventListener('keydown', h);
      }, [onClose]);
      return (
        <div style={{ position:'fixed', inset:0, zIndex:50, display:'flex', alignItems:'center', justifyContent:'center' }}
             className="modal-bg" onClick={onClose}>
          <div style={{ width:'100%', maxWidth:500, margin:'0 16px', maxHeight:'90vh', overflowY:'auto',
                        background:'#242424', border:'1px solid #3a3a3a', borderRadius:20 }}
               onClick={e => e.stopPropagation()}>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'18px 24px', borderBottom:'1px solid #2e2e2e' }}>
              <span style={{ fontSize:15, fontWeight:700 }}>{title}</span>
              <button onClick={onClose} style={{ background:'none', border:'none', color:'#555', fontSize:22, lineHeight:1, cursor:'pointer' }}>&times;</button>
            </div>
            <div style={{ padding:'20px 24px' }}>{children}</div>
          </div>
        </div>
      );
    }

    const Label = ({ children }) => (
      <div style={{ fontSize:11, fontWeight:700, color:'#555', textTransform:'uppercase', letterSpacing:'0.07em', marginBottom:6 }}>{children}</div>
    );

    /* ═══════════════════════════════════════════════
       CATEGORY MANAGER
    ═══════════════════════════════════════════════ */
    function CategoryManager({ categories, onChange, tasks, templates }) {
      const [editId, setEditId]           = useState(null);
      const [editLabel, setEditLabel]     = useState('');
      const [editIcon, setEditIcon]       = useState('');
      const [editPairIdx, setEditPairIdx] = useState(0);
      const [newLabel, setNewLabel]       = useState('');
      const [newIcon, setNewIcon]         = useState('🎯');
      const [newPairIdx, setNewPairIdx]   = useState(0);

      const usageCount = (catId) =>
        tasks.filter(t => t.category === catId).length +
        templates.filter(t => t.category === catId).length;

      const startEdit = (cat) => {
        setEditId(cat.id); setEditLabel(cat.label); setEditIcon(cat.icon);
        setEditPairIdx(colorPairIdx(cat.bg));
      };

      const saveEdit = () => {
        const pair = COLOR_PAIRS[editPairIdx];
        onChange(categories.map(c =>
          c.id === editId
            ? { ...c, label: editLabel.trim() || c.label, icon: editIcon || c.icon, bg: pair.bg, text: pair.text }
            : c
        ));
        setEditId(null);
      };

      const deleteCategory = (cat) => {
        const count = usageCount(cat.id);
        if (count > 0) { alert(`"${cat.label}" is used by ${count} task${count > 1 ? 's' : ''}. Reassign or delete those tasks first.`); return; }
        onChange(categories.filter(c => c.id !== cat.id));
      };

      const addCategory = () => {
        if (!newLabel.trim()) return;
        const pair = COLOR_PAIRS[newPairIdx];
        onChange([...categories, { id: uid(), label: newLabel.trim(), icon: newIcon, bg: pair.bg, text: pair.text }]);
        setNewLabel(''); setNewIcon('🎯'); setNewPairIdx(0);
      };

      const ColorPicker = ({ value, onChange: onCh }) => (
        <div style={{ display:'flex', flexWrap:'wrap', gap:5 }}>
          {COLOR_PAIRS.map((p, i) => (
            <button key={p.name} onClick={() => onCh(i)} style={{
              width:24, height:24, borderRadius:6, background:p.bg, border:'none', cursor:'pointer',
              boxShadow: value === i ? `0 0 0 2px #191919, 0 0 0 3.5px ${p.text}` : 'none',
              transform: value === i ? 'scale(1.15)' : 'scale(1)',
              transition:'transform 0.1s, box-shadow 0.1s',
            }} />
          ))}
        </div>
      );

      const EmojiPicker = ({ value, onChange: onCh }) => (
        <div>
          <div style={{ display:'flex', flexWrap:'wrap', gap:2, marginBottom:8 }}>
            {EMOJI_PRESETS.map(e => (
              <button key={e} onClick={() => onCh(e)}
                className={`emoji-btn ${value === e ? 'selected' : ''}`}>{e}</button>
            ))}
          </div>
          <div style={{ display:'flex', gap:8, alignItems:'center' }}>
            <span style={{ fontSize:11, color:'#555', fontWeight:600, whiteSpace:'nowrap' }}>Or type:</span>
            <input value={value} onChange={e => onCh(e.target.value)}
              style={{ width:60, textAlign:'center', fontSize:18, padding:'4px 8px' }} maxLength={4} />
          </div>
        </div>
      );

      return (
        <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
          {categories.map(cat => {
            const isEditing = editId === cat.id;
            const count = usageCount(cat.id);
            const curPair = COLOR_PAIRS[isEditing ? editPairIdx : colorPairIdx(cat.bg)] || COLOR_PAIRS[0];

            if (isEditing) {
              return (
                <div key={cat.id} style={{ background:'#252525', borderRadius:14, padding:14, border:'1px solid #3a3a3a', display:'flex', flexDirection:'column', gap:12 }}>
                  <div style={{ display:'flex', gap:10 }}>
                    <div style={{ width:40, height:40, borderRadius:10, background:curPair.bg, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:20 }}>{editIcon}</div>
                    <input value={editLabel} onChange={e => setEditLabel(e.target.value)}
                      onKeyDown={e => e.key === 'Enter' && saveEdit()}
                      style={{ flex:1, fontWeight:700, fontSize:14 }} placeholder="Category name" autoFocus />
                  </div>
                  <div><Label>Icon</Label><EmojiPicker value={editIcon} onChange={setEditIcon} /></div>
                  <div><Label>Color</Label><ColorPicker value={editPairIdx} onChange={setEditPairIdx} /></div>
                  <div style={{ display:'flex', gap:8 }}>
                    <button onClick={() => setEditId(null)} className="btn-ghost" style={{ flex:1 }}>Cancel</button>
                    <button onClick={saveEdit} style={{ flex:1, padding:'8px', borderRadius:10, fontSize:13, fontWeight:700, background:curPair.bg, color:curPair.text, border:'none', cursor:'pointer' }}>Save changes</button>
                  </div>
                </div>
              );
            }

            return (
              <div key={cat.id} className="group" style={{ display:'flex', alignItems:'center', gap:10, padding:'10px 12px', borderRadius:12, background:'#222' }}>
                <div style={{ width:32, height:32, borderRadius:8, background:cat.bg, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:17 }}>{cat.icon}</div>
                <span style={{ flex:1, fontSize:13, fontWeight:700, color:'#f0f0f0' }}>{cat.label}</span>
                {count > 0 && <span style={{ fontSize:11, color:'#555', fontWeight:600 }}>{count} task{count !== 1 ? 's' : ''}</span>}
                <button onClick={() => startEdit(cat)} className="group-hover-show"
                  style={{ fontSize:12, padding:'4px 10px', borderRadius:8, background:'#2e2e2e', color:'#aaa', border:'none', cursor:'pointer', fontWeight:600 }}>Edit</button>
                <button onClick={() => deleteCategory(cat)} className="group-hover-show"
                  style={{ background:'none', border:'none', cursor:'pointer', color:'#555', fontSize:16, lineHeight:1 }}
                  onMouseEnter={e => e.target.style.color='#f87171'} onMouseLeave={e => e.target.style.color='#555'}>&times;</button>
              </div>
            );
          })}

          <div style={{ background:'#1e1e1e', borderRadius:14, padding:14, border:'1px dashed #333', marginTop:6, display:'flex', flexDirection:'column', gap:12 }}>
            <Label>New category</Label>
            <div style={{ display:'flex', gap:10 }}>
              <div style={{ width:40, height:40, borderRadius:10, background:COLOR_PAIRS[newPairIdx].bg, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:20 }}>{newIcon}</div>
              <input value={newLabel} onChange={e => setNewLabel(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && addCategory()}
                style={{ flex:1, fontWeight:700, fontSize:14 }} placeholder="Category name (e.g. Side Projects)" />
            </div>
            <div><Label>Icon</Label><EmojiPicker value={newIcon} onChange={setNewIcon} /></div>
            <div><Label>Color</Label><ColorPicker value={newPairIdx} onChange={setNewPairIdx} /></div>
            <button onClick={addCategory} disabled={!newLabel.trim()}
              style={{ padding:'9px', borderRadius:10, fontSize:13, fontWeight:700, cursor:'pointer',
                background: newLabel.trim() ? COLOR_PAIRS[newPairIdx].bg : '#2a2a2a',
                color: newLabel.trim() ? COLOR_PAIRS[newPairIdx].text : '#555',
                border:'none', opacity: newLabel.trim() ? 1 : 0.6, transition:'background 0.15s, color 0.15s' }}>
              + Add category
            </button>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════
       BUCKET EDITOR
    ═══════════════════════════════════════════════ */
    function BucketEditor({ bucket, onSave, onClose }) {
      const [name, setName]       = useState(bucket?.name || '');
      const [color, setColor]     = useState(bucket?.color || PALETTE[0].id);
      const [explode, setExplode] = useState(bucket?.explode ?? true);
      const [subtasks, setSubs]   = useState(bucket?.subtasks ? [...bucket.subtasks] : []);
      const [stName, setStName]   = useState('');
      const [stDur, setStDur]     = useState('30');
      const [stPri, setStPri]     = useState('normal');
      const nameRef = useRef();
      useEffect(() => nameRef.current?.focus(), []);

      const addSub = () => {
        const n = stName.trim(); if (!n) return;
        setSubs(s => [...s, { id: uid(), name: n, duration: Math.max(5, parseInt(stDur) || 30), priority: stPri, done: false }]);
        setStName(''); setStDur('30'); setStPri('normal');
      };
      const save = () => {
        if (!name.trim()) return;
        onSave({ id: bucket?.id || uid(), name: name.trim(), color, explode, subtasks });
        onClose();
      };
      const pal = getColor(color);
      const total = subtasks.reduce((s, t) => s + t.duration, 0);

      return (
        <Modal title={bucket ? 'Edit Bucket' : 'New Bucket'} onClose={onClose}>
          <div style={{ display:'flex', flexDirection:'column', gap:18 }}>
            <div>
              <Label>Name</Label>
              <input ref={nameRef} value={name} onChange={e => setName(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && save()} style={{ width:'100%' }}
                placeholder="e.g. Job Search, Wedding, Personal" />
            </div>
            <div>
              <Label>Color</Label>
              <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
                {PALETTE.map(p => (
                  <button key={p.id} onClick={() => setColor(p.id)} style={{
                    width:32, height:32, borderRadius:8, background:p.bg, border:'none', cursor:'pointer',
                    boxShadow: color === p.id ? `0 0 0 2px #191919, 0 0 0 4px ${p.text}` : 'none',
                    transform: color === p.id ? 'scale(1.1)' : 'scale(1)',
                    transition:'box-shadow 0.15s, transform 0.1s',
                    display:'flex', alignItems:'center', justifyContent:'center',
                  }}>
                    {color === p.id && <div style={{ width:10, height:10, borderRadius:'50%', background:p.text }} />}
                  </button>
                ))}
              </div>
            </div>
            <div>
              <Label>Schedule as</Label>
              <div style={{ display:'flex', gap:8 }}>
                {[[true,'Individual blocks'],[false,'One combined block']].map(([v, lbl]) => (
                  <button key={String(v)} onClick={() => setExplode(v)} style={{
                    flex:1, padding:'9px 12px', borderRadius:10, fontSize:13, fontWeight:600, cursor:'pointer',
                    border: explode === v ? `1.5px solid ${pal.text}` : '1.5px solid #3a3a3a',
                    background: explode === v ? pal.bg : 'transparent',
                    color: explode === v ? pal.text : '#777',
                  }}>{lbl}</button>
                ))}
              </div>
            </div>
            <div>
              <Label>Subtasks {total > 0 && <span style={{ fontWeight:400, textTransform:'none', color:'#555', marginLeft:4 }}>· {fmtDur(total)} total</span>}</Label>
              <div style={{ display:'flex', flexDirection:'column', gap:5, marginBottom:10 }}>
                {subtasks.map(st => (
                  <div key={st.id} style={{ display:'flex', alignItems:'center', gap:8, padding:'8px 12px', borderRadius:10, background:pal.bg }}>
                    <div style={{ width:7, height:7, borderRadius:'50%', background:pal.text, flexShrink:0 }} />
                    <span style={{ flex:1, fontSize:13, fontWeight:600, color:pal.text }}>{st.name}</span>
                    <span style={{ fontSize:12, color:pal.text, opacity:0.6 }}>{fmtDur(st.duration)}</span>
                    {st.priority === 'high' && <span style={{ fontSize:11, color:'#d97706', fontWeight:700 }}>⚡</span>}
                    <button onClick={() => setSubs(s => s.filter(t => t.id !== st.id))}
                      style={{ background:'none', border:'none', cursor:'pointer', color:'#aaa', fontSize:16, lineHeight:1 }}>&times;</button>
                  </div>
                ))}
                {!subtasks.length && <p style={{ fontSize:13, color:'#555', fontStyle:'italic' }}>No subtasks yet.</p>}
              </div>
              <div style={{ background:'#2a2a2a', borderRadius:12, padding:12, display:'flex', flexDirection:'column', gap:8 }}>
                <div style={{ display:'flex', gap:8 }}>
                  <input value={stName} onChange={e => setStName(e.target.value)} onKeyDown={e => e.key === 'Enter' && addSub()}
                    style={{ flex:1 }} placeholder="Subtask name" />
                  <input type="number" value={stDur} onChange={e => setStDur(e.target.value)} min="5"
                    style={{ width:70, textAlign:'center' }} placeholder="min" />
                </div>
                <div style={{ display:'flex', gap:8 }}>
                  <select value={stPri} onChange={e => setStPri(e.target.value)} style={{ flex:1 }}>
                    <option value="normal">Normal priority</option>
                    <option value="high">⚡ High priority</option>
                  </select>
                  <button onClick={addSub} style={{ padding:'8px 18px', borderRadius:10, fontSize:13, fontWeight:700, background:pal.bg, color:pal.text, border:'none', cursor:'pointer' }}>+ Add</button>
                </div>
              </div>
            </div>
            <div style={{ display:'flex', gap:10, paddingTop:4 }}>
              <button onClick={onClose} className="btn-ghost" style={{ flex:1 }}>Cancel</button>
              <button onClick={save} disabled={!name.trim()} style={{ flex:1, padding:'10px', borderRadius:12, fontSize:13, fontWeight:700, background:pal.bg, color:pal.text, border:'none', cursor:'pointer', opacity:name.trim()?1:0.5 }}>
                {bucket ? 'Save changes' : 'Create bucket'}
              </button>
            </div>
          </div>
        </Modal>
      );
    }

    /* ═══════════════════════════════════════════════
       TASKS PANEL
    ═══════════════════════════════════════════════ */
    function TasksPanel({ buckets, tasks, fixedEvents, templates, fixedTemplates, schedule, categories,
        onAddTask, onDeleteTask, onAddFixed, onDeleteFixed,
        onNewBucket, onEditBucket, onDeleteBucket,
        onUseTemplate, onDeleteTemplate, onAddTemplate, onReorderTemplates,
        onSaveFixedTemplate, onDeleteFixedTemplate, onUseFixedTemplate,
        onCategoriesChange }) {

      const [tab, setTab] = useState('buckets');
      const [tName, setTName] = useState(''); const [tDur, setTDur] = useState('30');
      const [tCat, setTCat]   = useState(() => categories[0]?.id || 'work');
      const [tPri, setTPri]   = useState('normal');
      const [tSlot, setTSlot] = useState('any');
      const [feName, setFeName] = useState(''); const [feStart, setFeStart] = useState('09:00');
      const [feEnd, setFeEnd]   = useState('10:00');
      const [feCat, setFeCat]   = useState(() => categories[0]?.id || 'work');
      const [tmName, setTmName] = useState(''); const [tmDur, setTmDur] = useState('30');
      const [tmCat, setTmCat]   = useState(() => categories[0]?.id || 'work');
      // Fixed-event template form
      const [ftName, setFtName] = useState(''); const [ftStart, setFtStart] = useState('09:00');
      const [ftEnd, setFtEnd]   = useState('10:00');
      const [ftCat, setFtCat]   = useState(() => categories[0]?.id || 'work');
      // Template DnD
      const tplDragRef = useRef(null);
      const [tplDragIdx, setTplDragIdx] = useState(null);
      const [tplDragOver, setTplDragOver] = useState(null);

      const addTask = () => {
        const n = tName.trim(); if (!n) return;
        onAddTask({ id: uid(), name: n, duration: Math.max(5, parseInt(tDur) || 30), category: tCat, priority: tPri, slot: tSlot, done: false });
        setTName('');
      };
      const addFixed = () => {
        const n = feName.trim(); if (!n) return;
        const s = inputToMins(feStart), e = inputToMins(feEnd);
        if (e <= s) return;
        onAddFixed({ id: uid(), name: n, startTime: s, endTime: e, category: feCat });
        setFeName('');
      };
      const saveTpl = () => {
        const n = tmName.trim(); if (!n) return;
        onAddTemplate({ id: uid(), name: n, duration: Math.max(5, parseInt(tmDur) || 30), category: tmCat });
        setTmName('');
      };
      const saveFixedTpl = () => {
        const n = ftName.trim(); if (!n) return;
        const s = inputToMins(ftStart), e = inputToMins(ftEnd);
        if (e <= s) return;
        onSaveFixedTemplate({ id: uid(), name: n, startTime: s, endTime: e, category: ftCat });
        setFtName('');
      };

      const CatSelect = ({ value, onChange: onCh, style }) => (
        <select value={value} onChange={e => onCh(e.target.value)} style={style}>
          {categories.map(c => <option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}
        </select>
      );

      const itemCard = (cat) => ({
        display:'flex', alignItems:'center', gap:10, padding:'10px 14px', borderRadius:12, background:cat.bg,
      });

      const SLOT_LABELS = { any:'Any time', morning:'🌅 Morning', midday:'🍽 Midday', work:'☀️ Work hrs', evening:'🌆 Evening' };

      const onTplDragStart = (e, i) => { tplDragRef.current = i; setTplDragIdx(i); e.dataTransfer.effectAllowed = 'move'; };
      const onTplDragOver  = (e, i) => { e.preventDefault(); setTplDragOver(i); };
      const onTplDrop = (e, ti) => {
        e.preventDefault();
        const si = tplDragRef.current;
        if (si === null || si === ti) return;
        const next = [...templates]; const [item] = next.splice(si, 1); next.splice(ti, 0, item);
        onReorderTemplates(next); setTplDragIdx(null); setTplDragOver(null); tplDragRef.current = null;
      };
      const onTplDragEnd = () => { setTplDragIdx(null); setTplDragOver(null); tplDragRef.current = null; };

      const tabs = [
        ['buckets','Buckets'], ['tasks','Tasks'],
        ['fixed','Fixed Events'], ['templates','Templates'], ['categories','Categories'],
      ];

      return (
        <div>
          <div className="tab-scroll">
            {tabs.map(([id, lbl]) => {
              const counts = { buckets: buckets.length, tasks: tasks.length, fixed: fixedEvents.length, templates: 0, categories: 0 };
              return (
                <button key={id} onClick={() => setTab(id)} className={`tab-btn ${tab===id?'active':''}`}>
                  {lbl}
                  {counts[id] > 0 && <span style={{ marginLeft:5, fontSize:10, background:'#2e2e2e', color:'#777', padding:'1px 6px', borderRadius:99, fontWeight:700 }}>{counts[id]}</span>}
                </button>
              );
            })}
          </div>

          {tab === 'buckets' && (
            <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
              {buckets.map(b => {
                const pal = getColor(b.color);
                const dur = b.subtasks.reduce((s, t) => s + t.duration, 0);
                return (
                  <div key={b.id} className="group" style={{ background:pal.bg, borderLeft:`4px solid ${pal.text}44`, borderRadius:14, padding:14 }}>
                    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8 }}>
                      <div style={{ display:'flex', alignItems:'center', gap:8, flexWrap:'wrap' }}>
                        <span style={{ fontSize:14, fontWeight:700, color:pal.text }}>{b.name}</span>
                        {b.subtasks.length > 0 && <span style={{ fontSize:11, padding:'2px 8px', borderRadius:99, background:`${pal.text}18`, color:pal.text, fontWeight:700 }}>{b.subtasks.length} tasks · {fmtDur(dur)}</span>}
                        <span style={{ fontSize:11, padding:'2px 8px', borderRadius:99, background:`${pal.text}10`, color:pal.text, opacity:0.7, fontWeight:600 }}>{b.explode ? 'Individual' : 'One block'}</span>
                      </div>
                      <div style={{ display:'flex', gap:4 }}>
                        <button onClick={() => onEditBucket(b)} style={{ fontSize:12, padding:'4px 10px', borderRadius:8, background:`${pal.text}15`, color:pal.text, border:'none', cursor:'pointer', fontWeight:600 }}>Edit</button>
                        <button onClick={() => onDeleteBucket(b.id)} style={{ fontSize:13, padding:'4px 8px', borderRadius:8, background:'transparent', color:pal.text, opacity:0.5, border:'none', cursor:'pointer' }}>&times;</button>
                      </div>
                    </div>
                    <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
                      {b.subtasks.map(st => (
                        <div key={st.id} style={{ display:'flex', alignItems:'center', gap:8, fontSize:13, color:pal.text, opacity:0.75 }}>
                          <span style={{ width:5, height:5, borderRadius:'50%', background:pal.text, flexShrink:0, opacity:0.6 }} />
                          <span style={{ flex:1 }}>{st.name}</span>
                          <span style={{ fontSize:11, opacity:0.7 }}>{fmtDur(st.duration)}</span>
                          {st.priority === 'high' && <span style={{ fontSize:11, color:'#d97706', fontWeight:700 }}>⚡</span>}
                        </div>
                      ))}
                      {!b.subtasks.length && <p style={{ fontSize:12, color:pal.text, opacity:0.5, fontStyle:'italic' }}>No subtasks — click Edit to add some.</p>}
                    </div>
                  </div>
                );
              })}
              <button onClick={onNewBucket} style={{ padding:'12px', borderRadius:14, fontSize:13, fontWeight:600, color:'#555', background:'transparent', border:'1px dashed #333', cursor:'pointer' }}
                onMouseEnter={e => { e.target.style.color='#f0f0f0'; e.target.style.borderColor='#666'; }}
                onMouseLeave={e => { e.target.style.color='#555'; e.target.style.borderColor='#333'; }}>
                + New bucket
              </button>
